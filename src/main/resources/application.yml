spring:
  application:
    name: unraid-telegram-bot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/docker_bot_db}
    username: ${SPRING_DATASOURCE_USERNAME:docker_bot}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

telegram:
  enabled: ${TELEGRAM_ENABLED:true}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}
  long-poll-timeout-seconds: ${TELEGRAM_LONG_POLL_TIMEOUT_SECONDS:30}

app:
  initial-admin-telegram-id: ${APP_INITIAL_ADMIN_TELEGRAM_ID:}
  docker:
    host: ${APP_DOCKER_HOST:unix:///var/run/docker.sock}
    denylist: ${APP_DOCKER_DENYLIST:postgres,gitea,gitea-runner,docker-telegram-bot}
  logs:
    max-lines: ${APP_LOGS_MAX_LINES:300}
  exec:
    enabled: ${APP_EXEC_ENABLED:false}
    timeout-seconds: ${APP_EXEC_TIMEOUT_SECONDS:10}
    allow-shell: ${APP_EXEC_ALLOW_SHELL:false}
  response:
    max-chars: ${APP_RESPONSE_MAX_CHARS:3500}

logging:
  level:
    kz.fahrentech.unraidtelegrambot: INFO
